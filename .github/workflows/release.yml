name: Release

# Builds `miru` for five platforms and attaches them to a GitHub release.
#
# Triggered by a version tag. The repository carried no tags at all until
# v1.0.0, so this workflow and the first tag arrive together: there is no
# history of releases for it to be inconsistent with.
#
# `workflow_dispatch` does two jobs. With no `version`, it proves the whole
# thing builds without creating anything: a release workflow that can only be
# tested by tagging gets tested in production. With a `version`, it cuts the
# draft release itself.
#
# **The dispatch path exists because a tag cannot always be pushed.** Pushing
# `v1.8.0` from one environment returned `send-pack: unexpected disconnect` on
# every retry while branch pushes went through, which left a finished release
# with no way to publish it. Anything that can only be started by a `git push`
# of a tag has that single point of failure; this does not.
#
# **A dispatch creates the tag as well as the release.** The tag is made on
# GitHub's side, from the commit being built, before the draft is created, so
# somewhere that cannot push a tag can still produce one. The release is still
# a draft, because publishing stays a person's decision; the tag is not, because
# a release without one is not a release.
#
# An existing tag is refused rather than moved, and a published release is
# refused rather than replaced. A leftover *draft* is replaced, so that a second
# dispatch after deleting a tag does not trip over the first attempt.
#
# **Do not split this into a workflow that tags and a workflow that releases.**
# It is the obvious tidy-up and it does not work: a tag pushed with
# `GITHUB_TOKEN` does not trigger `on: push`, because GitHub suppresses that to
# stop workflows setting each other off. The tag workflow would succeed, the
# release workflow would never run, and the failure would look like nothing
# happening at all. Everything therefore happens in this one run.
#
# One catch, found the hard way: GitHub only offers `workflow_dispatch` for a
# workflow that exists on the *default* branch. Dispatching this file while it
# lived only on a feature branch returned a 404 that named nothing. So this file
# has to reach `main` before it can be dispatched from anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Cut a draft release for this version, for example 1.8.0. No leading
          v. Must match the version in Cargo.toml. Leave empty to build the
          five platforms and stop, creating nothing.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work. On a real
      # release every platform has to succeed anyway, and knowing which ones
      # broke is worth more than stopping early.
      fail-fast: false
      matrix:
        include:
          # A runner of the target's own architecture wherever one exists, so
          # nothing goes through a cross toolchain. Those are one more thing
          # that can be subtly wrong in a way which only appears on somebody
          # else's machine.
          #
          # Intel macOS is the exception, and it is not a choice. The `macos-13`
          # label is GitHub's retired Intel image: a job pinned to it sat queued
          # for twenty-five minutes with no runner ever assigned, while every
          # other job here finished inside two. Intel Mac runners are being
          # withdrawn everywhere, so moving to another Intel label would buy
          # months at best.
          #
          # Building x86-64 on Apple Silicon is not the fragile kind of
          # cross-compilation. Apple ships both architectures in one toolchain
          # and treats this as ordinary; it is how a universal binary has always
          # been made.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the Rust toolchain
        run: rustup target add ${{ matrix.target }}

      # No musl-tools step. A current Rust toolchain ships its own musl libc and
      # linker, and `cargo build --target x86_64-unknown-linux-musl` was checked
      # on a machine with no musl-gcc at all: it produced a static-pie binary
      # that runs. Installing a toolchain that is not used would be one more apt
      # call that can fail for reasons unrelated to this project.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin miru

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="miru-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/miru" "dist/$name/"
          strip "dist/$name/miru" || true
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          name="miru-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/miru.exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name")

      # The binary is checked here rather than only at the end, so a broken
      # build is reported by the job that made it.
      #
      # The x86-64 macOS binary is the one built on a different architecture.
      # An Apple Silicon runner has Rosetta, so it should run anyway. If it ever
      # cannot, this step is the thing that says so, which is why it is not
      # skipped for that target: an unrun binary is exactly the one worth
      # checking.
      - name: Check the binary runs
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/miru"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          echo 'print("release smoke test: " + str(6 * 7))' > smoke.miru
          "$bin" run smoke.miru

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: miru-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # A tag publishes, and so does a dispatch that named a version. A dispatch
    # that named none stops after `build`, having proven every platform compiles
    # and runs, and leaves the archives as artifacts.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    steps:
      # Before the download, not after. `actions/checkout` defaults to
      # `clean: true`, which runs `git clean -ffdx` over the workspace, and that
      # would delete the archives if they were already there. Checking out first
      # sidesteps it rather than turning the cleaning off.
      #
      # This job needs no source to build anything. It checks out for one
      # reason: the release notes are read from `CHANGELOG.md` below, and the
      # ref being built is the tag, so the file is the one that release ships.
      - name: Check out the code
        uses: actions/checkout@v5

      # A dispatched version is typed by hand into a form, and a typo would
      # otherwise mint a draft labelled for a version the binaries inside it are
      # not. The tag path needs no such check: the tag was cut from a commit
      # whose `Cargo.toml` already said so, and this same comparison would then
      # be checking that commit against itself.
      #
      # The cost of finding out here rather than before `build` is a few minutes
      # of platform builds on a typo. That is worth paying to keep the job graph
      # readable: a guard job would have to be `needs`-ed by `build`, and a
      # `needs` on a job that is skipped skips its dependents too, so the tag
      # path would stop working.
      - name: The dispatched version must be the one in Cargo.toml
        if: inputs.version != ''
        env:
          DISPATCHED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The first `version =` under `[package]`, which is the crate's own
          # and not one belonging to a dependency further down the file.
          declared="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [ "${DISPATCHED}" != "${declared}" ]; then
            echo "::error::Dispatched ${DISPATCHED}, but Cargo.toml says ${declared}."
            echo "The binaries built above are ${declared}. Release that, or bump Cargo.toml first."
            exit 1
          fi
          echo "Dispatched ${DISPATCHED}, which is what Cargo.toml says."

      # The tag is made here, on GitHub's side, which is the whole point: an
      # environment that cannot push a tag can still cut a release. `checkout`
      # leaves `GITHUB_TOKEN` configured for pushing, so this needs no secret of
      # its own beyond the `contents: write` this workflow already asks for.
      #
      # Annotated rather than lightweight, matching every tag this repository
      # already has.
      #
      # **An existing tag is refused, never moved.** A tag that points somewhere
      # new is the thing that makes a checkout of a version stop being
      # reproducible, and somebody re-dispatching after a fix almost never means
      # to do that. Delete the tag by hand if that really is the intent.
      - name: Create the tag
        if: inputs.version != ''
        env:
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists. A tag is never moved: delete it first if that is really the intent."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG#v}" "${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "Tagged ${GITHUB_SHA} as ${TAG}."

      - name: Collect the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One file for all five, so a user checks a download against a single
      # list rather than hunting for a per-file hash.
      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # A draft, not a published release. Publishing is a person's decision:
      # the notes are worth reading before anyone can download them, and a draft
      # can be deleted without leaving a version that the world briefly saw.
      # Publish from the Releases page when it looks right.
      #
      # The body is the section of `CHANGELOG.md` for the version being tagged,
      # which is written for a person to read. `--generate-notes` lists merged
      # pull requests instead, and when 1.0.1 shipped there were none, so it
      # produced "There were no pull requests associated with the commits
      # included in this release" and the real notes were pasted in by hand.
      #
      # This step cannot be proven by `workflow_dispatch`, because the job is
      # gated on the ref being a tag and a manual run skips it. The extraction
      # is a shell command and is checked by running it against `CHANGELOG.md`
      # directly. The tag is the first thing to exercise the `gh` call, and what
      # makes that acceptable is that the result is a draft and that a section
      # which cannot be found falls back rather than failing.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # A tag push names itself; a dispatch names a version and the tag is
          # that with a `v`, which the step above has just created. Either way
          # the ref exists by the time this runs, so no `--target` is needed.
          if [ -n "${DISPATCHED}" ]; then
            tag="v${DISPATCHED}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "Drafting ${tag}."

          # A re-dispatch after deleting the tag should not then trip over the
          # draft the first attempt left behind. Replacing a draft loses
          # nothing, because a draft is by definition unreleased.
          #
          # **A published release is never touched.** Deleting one takes a
          # version the world has already downloaded, and a workflow should not
          # be able to do that by accident.
          if existing="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "${existing}" = "true" ]; then
              echo "A draft for ${tag} exists already. Replacing it."
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes
            else
              echo "::error::${tag} is already published. Refusing to touch it."
              exit 1
            fi
          fi

          version="${tag#v}"
          notes="${RUNNER_TEMP}/release-notes.md"

          # Each `.` becomes `[.]` rather than being escaped with a backslash,
          # because awk implementations disagree about a backslash in a `gsub`
          # replacement. Left as a metacharacter, `1.0` would also match a
          # heading `## 100`.
          #
          # The version has to be followed by a space or the end of the line, so
          # a release of `1.0` does not take the `## 1.0.1` section. The
          # `## Unreleased` section cannot be selected at all: the version comes
          # from a `v*` tag and is never that word.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              BEGIN { gsub(/\./, "[.]", v); heading = "^## " v "([ \t]|$)" }
              $0 ~ heading { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > "$notes"
          else
            : > "$notes"
          fi

          # A heading with nothing under it is worth no more than no heading, so
          # this asks for content rather than for a file with bytes in it.
          # `grep` is avoided: it exits 1 when it matches nothing, and `set -e`
          # would end the job at the point the fallback is meant to run.
          if [ -n "$(tr -d '[:space:]' < "$notes")" ]; then
            echo "Notes for ${version} read from CHANGELOG.md ($(wc -l < "$notes") lines)."
            body=(--notes-file "$notes")
          else
            echo "No '## ${version}' section in CHANGELOG.md. Falling back to generated notes."
            body=(--generate-notes)
          fi

          # "MiruScriptX Release v1.1.0", not "v1.1.0". The tag name alone was
          # what this passed for 1.0.1 and 1.1.0, and both were renamed by hand
          # on the Releases page before publishing. A default that gets
          # corrected every time is the wrong default.
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MiruScriptX Release ${tag}" \
            "${body[@]}" \
            --draft \
            dist/*
          echo "Draft release created. Review and publish it from the Releases page."
