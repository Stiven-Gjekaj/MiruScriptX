[workspace]
# The root package is a member automatically. playground/ is listed so a
# workspace-wide build, test, or clippy run covers it too.
members = ["playground"]

[package]
name = "miruscriptx"
version = "0.7.12"
edition = "2021"
description = "MiruScriptX: a small, general-purpose scripting language written in Rust."
license = "MIT"
authors = ["Stiven Gjekaj"]
repository = "https://github.com/stiven-gjekaj/miruscriptx"
readme = "README.md"
keywords = ["language", "interpreter", "scripting"]
categories = ["compilers"]

# rustyline drives the REPL's line editing and history, which only src/repl.rs
# uses, and that module belongs to the binary rather than the library. Excluding
# it from wasm keeps the library buildable for a target that has no terminal.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "18"

[lib]
name = "miruscriptx"
path = "src/lib.rs"

[[bin]]
name = "miru"
path = "src/main.rs"

[[bench]]
name = "vm"
harness = false

[profile.release]
opt-level = 3

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
