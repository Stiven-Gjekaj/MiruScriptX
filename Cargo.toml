[workspace]
# The root package is a member automatically. playground/ is listed so a
# workspace-wide build, test, or clippy run covers it too.
members = ["playground"]

[package]
name = "miruscriptx"
version = "1.7.0"
edition = "2021"
description = "MiruScriptX: a complete, general-purpose scripting language written from scratch in Rust."
license = "MIT"
authors = ["Stiven Gjekaj"]
repository = "https://github.com/stiven-gjekaj/miruscriptx"
readme = "README.md"
keywords = ["language", "interpreter", "scripting"]
categories = ["compilers"]
# What ships to crates.io. The language, its documentation, and its examples,
# and nothing that only serves the repository. Excluding these takes the package
# from 76 files to 59 and drops the parts a person who installs the crate cannot
# use: the CI configuration, the benchmark harness, the test suite, the logo
# (the README now points at its URL, because crates.io does not resolve a
# relative image path), and the two maintenance scripts.
exclude = [
    ".github/",
    "assets/",
    "benches/",
    "tests/",
    "scripts/",
]

# rustyline drives the REPL's line editing and history, which only src/repl.rs
# uses, and that module belongs to the binary rather than the library. Excluding
# it from wasm keeps the library buildable for a target that has no terminal.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "18"

# Raw terminal mode, which `read_key` needs and which is the one thing in this
# project that cannot be written portably.
#
# **Neither of these adds a crate to the tree.** rustyline already depends on
# `nix` with the `term` and `poll` features on unix, and on `windows-sys` with
# `Win32_System_Console` on windows, at these same versions. Declaring them here
# makes explicit what already compiles, and it is why `crossterm`, which does
# the same job and brings eight or so crates of its own, was not used.
#
# The gates are `cfg(unix)` and `cfg(windows)` rather than the target_arch gate
# above, because they say what the code actually needs. Both are false for
# wasm32-unknown-unknown, so the playground gets neither.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term", "poll"], default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[lib]
name = "miruscriptx"
path = "src/lib.rs"

[[bin]]
name = "miru"
path = "src/main.rs"

[[bench]]
name = "vm"
harness = false

[profile.release]
opt-level = 3

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
