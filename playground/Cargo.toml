[package]
name = "miruscriptx-playground"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings that run MiruScriptX in a browser."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miruscriptx = { path = ".." }
# Pinned exactly. wasm-bindgen generates glue that only a wasm-bindgen-cli of
# the same version can consume, and a mismatch fails the build with a version
# error rather than anything that names the cause. The version here and the one
# installed by .github/workflows/pages.yml move together.
wasm-bindgen = "=0.2.100"
